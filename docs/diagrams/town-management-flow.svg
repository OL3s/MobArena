<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Town Management Flow</title>
  <desc id="desc">RosterYard is the central management surface. Gladiators and items move through drag and drop into buildings, overlays, and phase work before arena launch or next day.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#55412c"/></marker><style>.bg{fill:#f6efe3}.box{fill:#fffaf0;stroke:#55412c;stroke-width:2;rx:12}.b{fill:#eef7ef;stroke:#47724d;stroke-width:2;rx:12}.t{font:700 18px serif;fill:#251d15}.s{font:14px sans-serif;fill:#33291e}.line{stroke:#55412c;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="980" height="360"/>
  <rect class="box" x="395" y="35" width="190" height="80"/><text class="t" x="490" y="67" text-anchor="middle">RosterYard</text><text class="s" x="490" y="92" text-anchor="middle">visible roster + drag/drop</text>
  <rect class="b" x="80" y="160" width="160" height="80"/><text class="t" x="160" y="190" text-anchor="middle">Market</text><text class="s" x="160" y="214" text-anchor="middle">recruit, buy, sell</text>
  <rect class="b" x="300" y="160" width="160" height="80"/><text class="t" x="380" y="190" text-anchor="middle">Recovery Bay</text><text class="s" x="380" y="214" text-anchor="middle">health/exhaustion work</text>
  <rect class="b" x="520" y="160" width="160" height="80"/><text class="t" x="600" y="190" text-anchor="middle">Training Hall</text><text class="s" x="600" y="214" text-anchor="middle">attribute XP work</text>
  <rect class="b" x="740" y="160" width="160" height="80"/><text class="t" x="820" y="190" text-anchor="middle">Arena</text><text class="s" x="820" y="214" text-anchor="middle">contracts + controls</text>
  <line class="line" x1="430" y1="115" x2="190" y2="160"/><line class="line" x1="470" y1="115" x2="400" y2="160"/><line class="line" x1="510" y1="115" x2="580" y2="160"/><line class="line" x1="550" y1="115" x2="790" y2="160"/>
  <rect class="box" x="300" y="285" width="380" height="50"/><text class="t" x="490" y="316" text-anchor="middle">PhaseTransitionController resolves work, costs, weather, and day/night.</text>
  <line class="line" x1="380" y1="240" x2="440" y2="285"/><line class="line" x1="600" y1="240" x2="540" y2="285"/><line class="line" x1="820" y1="240" x2="630" y2="285"/>
</svg>
