<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">MobArena Input Authority Model</title>
  <desc id="desc">Local controls, touch, gamepads, input-only clients, and full clients all send input intent into the same host-side assignment path. The host owns simulation, combat, saves, rewards, and scene transitions.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#553f28"/></marker><style>.bg{fill:#f8f1e7}.client{fill:#eef4ff;stroke:#486a8f;stroke-width:2;rx:14}.host{fill:#eef8ef;stroke:#47704c;stroke-width:2;rx:14}.no{fill:#fff0ef;stroke:#8a4a44;stroke-width:2;rx:14}.t{font:700 18px serif;fill:#211912}.s{font:14px sans-serif;fill:#31271d}.line{stroke:#553f28;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1040" height="360"/>
  <rect class="client" x="55" y="50" width="210" height="70"/><text class="t" x="160" y="80" text-anchor="middle">Local Controls</text><text class="s" x="160" y="104" text-anchor="middle">keyboard, mouse, gamepad</text>
  <rect class="client" x="55" y="145" width="210" height="70"/><text class="t" x="160" y="175" text-anchor="middle">Touch / Phone</text><text class="s" x="160" y="199" text-anchor="middle">same-device or controller</text>
  <rect class="client" x="55" y="240" width="210" height="70"/><text class="t" x="160" y="270" text-anchor="middle">Remote Client</text><text class="s" x="160" y="294" text-anchor="middle">input-only or full client</text>
  <rect class="host" x="405" y="95" width="250" height="125"/><text class="t" x="530" y="130" text-anchor="middle">Host Assignment</text><text class="s" x="530" y="156" text-anchor="middle">LocalInputConfig</text><text class="s" x="530" y="178" text-anchor="middle">controller rows -> gladiators</text><text class="s" x="530" y="200" text-anchor="middle">input intent only</text>
  <rect class="host" x="760" y="80" width="230" height="155"/><text class="t" x="875" y="115" text-anchor="middle">Host Authority</text><text class="s" x="875" y="141" text-anchor="middle">simulation + enemy AI</text><text class="s" x="875" y="163" text-anchor="middle">combat + rewards</text><text class="s" x="875" y="185" text-anchor="middle">save/run mutations</text><text class="s" x="875" y="207" text-anchor="middle">scene transitions</text>
  <rect class="no" x="405" y="270" width="585" height="52"/><text class="t" x="697" y="303" text-anchor="middle">Clients never own combat outcomes, rewards, saves, or transitions.</text>
  <line class="line" x1="265" y1="85" x2="405" y2="135"/><line class="line" x1="265" y1="180" x2="405" y2="160"/><line class="line" x1="265" y1="275" x2="405" y2="185"/><line class="line" x1="655" y1="158" x2="760" y2="158"/>
</svg>
