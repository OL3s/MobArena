<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">MobArena Source Layout Map</title>
  <desc id="desc">A quick map of the repository: autoloads hold global services, scripts hold C# code and resources, scenes hold Godot scene trees, resources hold authored data, assets hold runtime art, docs hold documentation, and tests hold manual sandboxes.</desc>
  <defs><style>.bg{fill:#f8f1e7}.root{fill:#fffaf0;stroke:#553f28;stroke-width:2;rx:14}.code{fill:#eef4ff;stroke:#486a8f;stroke-width:2;rx:14}.data{fill:#eef8ef;stroke:#47704c;stroke-width:2;rx:14}.asset{fill:#fff1e8;stroke:#9a5b33;stroke-width:2;rx:14}.doc{fill:#f2efff;stroke:#6652a3;stroke-width:2;rx:14}.t{font:700 18px serif;fill:#211912}.s{font:14px sans-serif;fill:#31271d}</style></defs>
  <rect class="bg" width="1100" height="430"/>
  <rect class="root" x="430" y="25" width="240" height="70"/><text class="t" x="550" y="55" text-anchor="middle">MobArena root</text><text class="s" x="550" y="78" text-anchor="middle">Godot C# project</text>
  <rect class="code" x="40" y="145" width="210" height="95"/><text class="t" x="145" y="178" text-anchor="middle">autoload/</text><text class="s" x="145" y="204" text-anchor="middle">global runtime nodes</text><text class="s" x="145" y="225" text-anchor="middle">save, overlay, input</text>
  <rect class="code" x="290" y="145" width="210" height="95"/><text class="t" x="395" y="178" text-anchor="middle">scripts/</text><text class="s" x="395" y="204" text-anchor="middle">C# gameplay/resources</text><text class="s" x="395" y="225" text-anchor="middle">mutation APIs</text>
  <rect class="code" x="540" y="145" width="210" height="95"/><text class="t" x="645" y="178" text-anchor="middle">scenes/</text><text class="s" x="645" y="204" text-anchor="middle">Godot scene trees</text><text class="s" x="645" y="225" text-anchor="middle">components + overlays</text>
  <rect class="data" x="790" y="145" width="210" height="95"/><text class="t" x="895" y="178" text-anchor="middle">resources/</text><text class="s" x="895" y="204" text-anchor="middle">authored .tres data</text><text class="s" x="895" y="225" text-anchor="middle">items, mobs, contracts</text>
  <rect class="asset" x="165" y="295" width="210" height="85"/><text class="t" x="270" y="327" text-anchor="middle">assets/</text><text class="s" x="270" y="353" text-anchor="middle">runtime art/icons/shaders</text>
  <rect class="doc" x="445" y="295" width="210" height="85"/><text class="t" x="550" y="327" text-anchor="middle">docs/</text><text class="s" x="550" y="353" text-anchor="middle">Markdown + diagrams</text>
  <rect class="root" x="725" y="295" width="210" height="85"/><text class="t" x="830" y="327" text-anchor="middle">tests/</text><text class="s" x="830" y="353" text-anchor="middle">manual scenes + sandbox</text>
</svg>
