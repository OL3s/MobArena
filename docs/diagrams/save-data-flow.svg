<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Save Data Flow</title>
  <desc id="desc">SaveNode owns loading and saving. Runtime resources hold current run, career, phase, weather, settings, and completed company history.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#513d28"/></marker><style>.bg{fill:#f7f1e8}.box{fill:#fffaf0;stroke:#513d28;stroke-width:2;rx:12}.save{fill:#eef8ef;stroke:#47704c;stroke-width:2;rx:12}.file{fill:#eef4ff;stroke:#486a8f;stroke-width:2;rx:12}.t{font:700 18px serif;fill:#211912}.s{font:14px sans-serif;fill:#31271d}.line{stroke:#513d28;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="980" height="360"/>
  <rect class="save" x="390" y="35" width="200" height="80"/><text class="t" x="490" y="68" text-anchor="middle">SaveNode</text><text class="s" x="490" y="92" text-anchor="middle">runtime + persistence boundary</text>
  <rect class="box" x="80" y="170" width="180" height="80"/><text class="t" x="170" y="202" text-anchor="middle">Run Data</text><text class="s" x="170" y="226" text-anchor="middle">current company state</text>
  <rect class="box" x="300" y="170" width="180" height="80"/><text class="t" x="390" y="202" text-anchor="middle">Career Data</text><text class="s" x="390" y="226" text-anchor="middle">lifetime totals</text>
  <rect class="box" x="520" y="170" width="180" height="80"/><text class="t" x="610" y="202" text-anchor="middle">Shared State</text><text class="s" x="610" y="226" text-anchor="middle">phase, weather, settings</text>
  <rect class="box" x="740" y="170" width="180" height="80"/><text class="t" x="830" y="202" text-anchor="middle">History</text><text class="s" x="830" y="226" text-anchor="middle">completed companies</text>
  <line class="line" x1="430" y1="115" x2="190" y2="170"/><line class="line" x1="470" y1="115" x2="390" y2="170"/><line class="line" x1="515" y1="115" x2="610" y2="170"/><line class="line" x1="555" y1="115" x2="830" y2="170"/>
  <rect class="file" x="360" y="290" width="260" height="45"/><text class="t" x="490" y="319" text-anchor="middle">user://save resource files</text>
  <line class="line" x1="490" y1="250" x2="490" y2="290"/>
</svg>
