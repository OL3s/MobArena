<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
  <title id="title">MobArena Testing Workflow</title>
  <desc id="desc">Standard validation runs Godot import, dotnet build, and a headless Godot launch. Manual workflows include the mob fight test scene, attack effect sandbox, and CLI save/run mutation commands.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#553f28"/></marker><style>.bg{fill:#f8f1e7}.box{fill:#fffaf0;stroke:#553f28;stroke-width:2;rx:14}.manual{fill:#eef4ff;stroke:#486a8f;stroke-width:2;rx:14}.t{font:700 18px serif;fill:#211912}.s{font:14px sans-serif;fill:#31271d}.line{stroke:#553f28;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1040" height="320"/>
  <rect class="box" x="45" y="65" width="190" height="80"/><text class="t" x="140" y="96" text-anchor="middle">Import</text><text class="s" x="140" y="121" text-anchor="middle">godot --headless --import</text>
  <rect class="box" x="305" y="65" width="190" height="80"/><text class="t" x="400" y="96" text-anchor="middle">Build</text><text class="s" x="400" y="121" text-anchor="middle">dotnet build</text>
  <rect class="box" x="565" y="65" width="190" height="80"/><text class="t" x="660" y="96" text-anchor="middle">Startup</text><text class="s" x="660" y="121" text-anchor="middle">godot --headless --quit</text>
  <rect class="box" x="825" y="65" width="170" height="80"/><text class="t" x="910" y="96" text-anchor="middle">Result</text><text class="s" x="910" y="121" text-anchor="middle">fix or continue</text>
  <line class="line" x1="235" y1="105" x2="305" y2="105"/><line class="line" x1="495" y1="105" x2="565" y2="105"/><line class="line" x1="755" y1="105" x2="825" y2="105"/>
  <rect class="manual" x="145" y="215" width="210" height="70"/><text class="t" x="250" y="244" text-anchor="middle">Combat Room</text><text class="s" x="250" y="268" text-anchor="middle">tests/test_mob_fight.tscn</text>
  <rect class="manual" x="415" y="215" width="210" height="70"/><text class="t" x="520" y="244" text-anchor="middle">Attack Sandbox</text><text class="s" x="520" y="268" text-anchor="middle">tests/attack_effect_sandbox.tscn</text>
  <rect class="manual" x="685" y="215" width="210" height="70"/><text class="t" x="790" y="244" text-anchor="middle">CLI Commands</text><text class="s" x="790" y="268" text-anchor="middle">save/run mutation checks</text>
</svg>
