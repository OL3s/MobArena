<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Arena Combat Runtime Flow</title>
  <desc id="desc">Town-selected contracts and assigned gladiators feed arena spawners. Combatants fight through shared combat state. Arena resolves victory, defeat, forfeit, and returns to town or main menu.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4d3a28"/></marker><style>.bg{fill:#f4efe6}.box{fill:#fffaf0;stroke:#4d3a28;stroke-width:2;rx:12}.a{fill:#eef4ff;stroke:#486a8f;stroke-width:2;rx:12}.r{fill:#fff0ef;stroke:#884c45;stroke-width:2;rx:12}.t{font:700 18px serif;fill:#201912}.s{font:14px sans-serif;fill:#31271d}.line{stroke:#4d3a28;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="980" height="360"/>
  <rect class="box" x="45" y="70" width="190" height="85"/><text class="t" x="140" y="103" text-anchor="middle">Run Data</text><text class="s" x="140" y="128" text-anchor="middle">active contract</text><text class="s" x="140" y="148" text-anchor="middle">arena assignments</text>
  <line class="line" x1="235" y1="112" x2="315" y2="112"/>
  <rect class="a" x="315" y="40" width="170" height="80"/><text class="t" x="400" y="72" text-anchor="middle">PlayerSpawner</text><text class="s" x="400" y="96" text-anchor="middle">gladiators + controls</text>
  <rect class="a" x="315" y="145" width="170" height="80"/><text class="t" x="400" y="177" text-anchor="middle">EnemySpawner</text><text class="s" x="400" y="201" text-anchor="middle">contract mobs</text>
  <line class="line" x1="485" y1="80" x2="570" y2="130"/><line class="line" x1="485" y1="185" x2="570" y2="160"/>
  <rect class="box" x="570" y="100" width="180" height="100"/><text class="t" x="660" y="132" text-anchor="middle">Combatants</text><text class="s" x="660" y="157" text-anchor="middle">ArenaCombatState</text><text class="s" x="660" y="178" text-anchor="middle">damage, health, death</text>
  <line class="line" x1="750" y1="150" x2="815" y2="150"/>
  <rect class="r" x="815" y="95" width="125" height="110"/><text class="t" x="878" y="128" text-anchor="middle">Arena</text><text class="s" x="878" y="152" text-anchor="middle">victory</text><text class="s" x="878" y="172" text-anchor="middle">loss</text><text class="s" x="878" y="192" text-anchor="middle">forfeit</text>
  <rect class="box" x="405" y="270" width="250" height="55"/><text class="t" x="530" y="304" text-anchor="middle">Result resolver saves and transitions.</text>
  <line class="line" x1="878" y1="205" x2="620" y2="270"/>
</svg>
