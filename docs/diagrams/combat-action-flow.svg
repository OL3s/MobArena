<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" role="img" aria-labelledby="title desc">
  <title id="title">Combat Action Flow</title>
  <desc id="desc">An item or future mob action points to ArenaCombatActionData, which points to a typed effect resource. The action runner spawns the reusable effect scene and applies payloads to combatants.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#513d28"/></marker><style>.bg{fill:#f7f0e6}.box{fill:#fffaf0;stroke:#513d28;stroke-width:2;rx:12}.data{fill:#eef7ff;stroke:#456c91;stroke-width:2;rx:12}.scene{fill:#eef8ef;stroke:#48734d;stroke-width:2;rx:12}.t{font:700 17px serif;fill:#211912}.s{font:14px sans-serif;fill:#31281f}.line{stroke:#513d28;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="980" height="280"/>
  <rect class="box" x="35" y="95" width="130" height="75"/><text class="t" x="100" y="125" text-anchor="middle">Item/Mob</text><text class="s" x="100" y="149" text-anchor="middle">source action</text>
  <line class="line" x1="165" y1="132" x2="235" y2="132"/>
  <rect class="data" x="235" y="80" width="180" height="105"/><text class="t" x="325" y="112" text-anchor="middle">ActionData</text><text class="s" x="325" y="137" text-anchor="middle">timing, stamina</text><text class="s" x="325" y="158" text-anchor="middle">buildup, effect</text>
  <line class="line" x1="415" y1="132" x2="485" y2="132"/>
  <rect class="data" x="485" y="80" width="180" height="105"/><text class="t" x="575" y="112" text-anchor="middle">EffectData</text><text class="s" x="575" y="137" text-anchor="middle">melee, projectile</text><text class="s" x="575" y="158" text-anchor="middle">thrown, AOE</text>
  <line class="line" x1="665" y1="132" x2="735" y2="132"/>
  <rect class="scene" x="735" y="80" width="200" height="105"/><text class="t" x="835" y="112" text-anchor="middle">Effect Scene</text><text class="s" x="835" y="137" text-anchor="middle">IArenaCombatEffect</text><text class="s" x="835" y="158" text-anchor="middle">ApplyDamage/status/force</text>
</svg>
