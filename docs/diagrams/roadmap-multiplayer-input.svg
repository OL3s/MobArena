<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title desc">
  <title id="title">Roadmap: Multiplayer And Input-Only Clients</title>
  <desc id="desc">Phones, clients, and remote controllers send input intent only. The host owns simulation, enemy AI, combat resolution, save mutations, and scene transitions.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#513d28"/></marker><style>.bg{fill:#f7f1e8}.client{fill:#eef4ff;stroke:#486a8f;stroke-width:2;rx:12}.host{fill:#eef8ef;stroke:#47704c;stroke-width:2;rx:12}.no{fill:#fff0ef;stroke:#884c45;stroke-width:2;rx:12}.t{font:700 18px serif;fill:#211912}.s{font:14px sans-serif;fill:#31271d}.line{stroke:#513d28;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="980" height="330"/>
  <rect class="client" x="60" y="55" width="230" height="95"/><text class="t" x="175" y="90" text-anchor="middle">Input Clients</text><text class="s" x="175" y="116" text-anchor="middle">phone, browser, controller</text><text class="s" x="175" y="138" text-anchor="middle">send intent only</text>
  <line class="line" x1="290" y1="102" x2="410" y2="102"/>
  <rect class="host" x="410" y="35" width="260" height="135"/><text class="t" x="540" y="70" text-anchor="middle">Host</text><text class="s" x="540" y="96" text-anchor="middle">simulation + enemy AI</text><text class="s" x="540" y="118" text-anchor="middle">combat and results</text><text class="s" x="540" y="140" text-anchor="middle">save/run state + scenes</text>
  <line class="line" x1="540" y1="170" x2="540" y2="220"/>
  <rect class="no" x="360" y="220" width="360" height="70"/><text class="t" x="540" y="250" text-anchor="middle">Not Client Authoritative</text><text class="s" x="540" y="274" text-anchor="middle">clients do not own hits, rewards, saves, or transitions</text>
</svg>
