<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">MobArena Architecture Overview</title>
  <desc id="desc">Autoloads hold global services, scenes own presentation and flow, resources own game data and mutation APIs, and authored resources feed town and arena systems.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5a4631"/></marker><style>.bg{fill:#f7f3ea}.box{fill:#fffaf1;stroke:#5a4631;stroke-width:2;rx:12}.sys{fill:#edf7ef;stroke:#46704e;stroke-width:2;rx:12}.scene{fill:#eef5ff;stroke:#486b8f;stroke-width:2;rx:12}.res{fill:#fff1f1;stroke:#8a4a44;stroke-width:2;rx:12}.t{font:700 18px serif;fill:#221b14}.s{font:14px sans-serif;fill:#302820}.line{stroke:#5a4631;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="980" height="420"/>
  <rect class="sys" x="40" y="45" width="235" height="130"/><text class="t" x="158" y="78" text-anchor="middle">Autoloads</text><text class="s" x="158" y="106" text-anchor="middle">GlobalOverlay</text><text class="s" x="158" y="128" text-anchor="middle">SaveNode</text><text class="s" x="158" y="150" text-anchor="middle">RuntimeTagOverlay / LocalInputConfig</text>
  <rect class="scene" x="375" y="45" width="230" height="130"/><text class="t" x="490" y="78" text-anchor="middle">Scenes</text><text class="s" x="490" y="106" text-anchor="middle">Main Menu</text><text class="s" x="490" y="128" text-anchor="middle">Town</text><text class="s" x="490" y="150" text-anchor="middle">Arena</text>
  <rect class="res" x="705" y="45" width="235" height="130"/><text class="t" x="823" y="78" text-anchor="middle">Authored Resources</text><text class="s" x="823" y="106" text-anchor="middle">items, mobs, contracts</text><text class="s" x="823" y="128" text-anchor="middle">families, appearances</text><text class="s" x="823" y="150" text-anchor="middle">combat profiles/actions</text>
  <line class="line" x1="275" y1="110" x2="375" y2="110"/><line class="line" x1="705" y1="110" x2="605" y2="110"/>
  <rect class="box" x="120" y="260" width="230" height="95"/><text class="t" x="235" y="292" text-anchor="middle">Run Data</text><text class="s" x="235" y="318" text-anchor="middle">CompanyRunData</text><text class="s" x="235" y="340" text-anchor="middle">Career, phase, weather, settings</text>
  <rect class="box" x="375" y="260" width="230" height="95"/><text class="t" x="490" y="292" text-anchor="middle">Boundaries</text><text class="s" x="490" y="318" text-anchor="middle">PhaseTransitionController</text><text class="s" x="490" y="340" text-anchor="middle">contract/spawner/effect APIs</text>
  <rect class="box" x="630" y="260" width="230" height="95"/><text class="t" x="745" y="292" text-anchor="middle">Runtime Effects</text><text class="s" x="745" y="318" text-anchor="middle">ArenaCombatant</text><text class="s" x="745" y="340" text-anchor="middle">Action -> Effect -> Apply</text>
  <line class="line" x1="160" y1="175" x2="210" y2="260"/><line class="line" x1="490" y1="175" x2="490" y2="260"/><line class="line" x1="823" y1="175" x2="760" y2="260"/>
</svg>
