<svg xmlns="http://www.w3.org/2000/svg" width="920" height="320" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">MobArena Documentation Reading Flow</title>
  <desc id="desc">README points readers to project-overview. Project overview points AI agents to ai-agent, focuspoint, and relevant topic docs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#6b5136"/></marker>
    <style>
      .bg{fill:#f8f2e8}.box{fill:#fffaf0;stroke:#6b5136;stroke-width:2;rx:14}.topic{fill:#eef5ff;stroke:#4f6f91;stroke-width:2;rx:12}.ai{fill:#fff0ee;stroke:#8a4d45;stroke-width:2;rx:12}.t{font:700 20px serif;fill:#2d241b}.s{font:15px sans-serif;fill:#3b3026}.line{stroke:#6b5136;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="920" height="320"/>
  <rect class="box" x="50" y="118" width="160" height="84"/>
  <text class="t" x="130" y="152" text-anchor="middle">README</text>
  <text class="s" x="130" y="178" text-anchor="middle">short entry point</text>
  <line class="line" x1="210" y1="160" x2="320" y2="160"/>
  <rect class="box" x="320" y="100" width="230" height="120"/>
  <text class="t" x="435" y="140" text-anchor="middle">project-overview</text>
  <text class="s" x="435" y="166" text-anchor="middle">hub, status, doc map</text>
  <text class="s" x="435" y="190" text-anchor="middle">start here after README</text>
  <line class="line" x1="550" y1="138" x2="675" y2="78"/>
  <line class="line" x1="550" y1="160" x2="675" y2="160"/>
  <line class="line" x1="550" y1="184" x2="675" y2="242"/>
  <rect class="ai" x="675" y="38" width="195" height="70"/>
  <text class="t" x="772" y="68" text-anchor="middle">AI agents</text>
  <text class="s" x="772" y="92" text-anchor="middle">read ai-agent + focuspoint</text>
  <rect class="topic" x="675" y="125" width="195" height="70"/>
  <text class="t" x="772" y="154" text-anchor="middle">Topic docs</text>
  <text class="s" x="772" y="178" text-anchor="middle">town, arena, authoring</text>
  <rect class="topic" x="675" y="212" width="195" height="70"/>
  <text class="t" x="772" y="242" text-anchor="middle">References</text>
  <text class="s" x="772" y="266" text-anchor="middle">testing, CLI, logger</text>
</svg>
